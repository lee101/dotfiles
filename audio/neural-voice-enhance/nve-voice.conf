# Native-PipeWire chain: HPF -> NVE (tiny causal net, ~2.7 ms algorithmic) -> presence EQ (makeup gain + soft limit inside NVE).
context.properties = { log.level = 1 }
context.spa-libs = {
 audio.convert.* = audioconvert/libspa-audioconvert
 support.* = support/libspa-support
}
context.modules = [
 { name = libpipewire-module-rt flags = [ ifexists nofail ] }
 { name = libpipewire-module-protocol-native }
 { name = libpipewire-module-client-node }
 { name = libpipewire-module-adapter }
 { name = libpipewire-module-metadata }

 { name = libpipewire-module-filter-chain
   args = {
     node.description = "Enhanced Voice NVE"
     media.name = "Enhanced Voice NVE"
     filter.graph = {
       nodes = [
         { type = builtin  name = hpf   label = bq_highpass  control = { "Freq" = 70 "Q" = 0.707 } }
         { type = ladspa   name = nve   plugin = /home/lee/.ladspa/libnve.so  label = nve_mono  control = { "Gain (dB)" = 14.0 "Floor" = 0.0 "Strength" = 1.0 "Aesthetic" = 0.0 } }
         { type = builtin  name = pres  label = bq_peaking   control = { "Freq" = 3500 "Q" = 1.0 "Gain" = 1.0 } }
       ]
       links = [
         { output = "hpf:Out"   input = "nve:Input" }
         { output = "nve:Output" input = "pres:In" }
       ]
       inputs  = [ "hpf:In" ]
       outputs = [ "pres:Out" ]
     }
     audio.rate = 48000
     audio.channels = 1
     audio.position = [ MONO ]
     capture.props = {
       node.name = nve_capture
       node.passive = true
       target.object = alsa_input.usb-Soundprese_HD_USB_Audio_Device-00.analog-stereo
       node.latency = 64/48000
     }
     playback.props = {
       node.name = enhanced_voice_nve
       node.description = "Enhanced Voice NVE"
       media.class = Audio/Source
       node.virtual = true
       node.latency = 64/48000
     }
   }
 }
]
